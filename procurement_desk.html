<title>Metals Procurement Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0E1418; --ink-2:#3A464F; --ink-3:#6B7A85;
  --ground:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F9;
  --line:#D3DBE1; --line-2:#E4EAEE;
  --accent:#0072B2; --accent-soft:#E1EFF8;
  --c-fob:#0072B2; --c-frt:#CC79A7; --c-duty:#D55E00;
  --good:#1E7A4C; --warn:#A8620A; --crit:#B3261E;
  --good-bg:#E3F2EA; --warn-bg:#FBEEDD; --crit-bg:#FBE7E5;
  --shadow:0 1px 2px rgba(14,20,24,.06),0 4px 14px rgba(14,20,24,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E4EAEE; --ink-2:#A9B6C0; --ink-3:#7C8A95;
  --ground:#11161A; --surface:#181E23; --surface-2:#1E262C;
  --line:#2C363E; --line-2:#232B32;
  --accent:#3391D0; --accent-soft:#132632;
  --c-fob:#3391D0; --c-frt:#BC6C97; --c-duty:#DA6E1E;
  --good:#4FB483; --warn:#D69433; --crit:#E5776B;
  --good-bg:#12241B; --warn-bg:#241C0F; --crit-bg:#2A1614;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ink:#E4EAEE; --ink-2:#A9B6C0; --ink-3:#7C8A95;
  --ground:#11161A; --surface:#181E23; --surface-2:#1E262C;
  --line:#2C363E; --line-2:#232B32;
  --accent:#3391D0; --accent-soft:#132632;
  --c-fob:#3391D0; --c-frt:#BC6C97; --c-duty:#DA6E1E;
  --good:#4FB483; --warn:#D69433; --crit:#E5776B;
  --good-bg:#12241B; --warn-bg:#241C0F; --crit-bg:#2A1614;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px}
h1,h2,h3{margin:0;font-family:var(--cond);font-weight:600;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ 1. PINNED VERDICT (BLUF) ============
   Sticky, and it snaps to a compact strip on scroll — the SAP Fiori
   dynamic-page pattern. A reader who never scrolls can still act. */
.verdict{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.v-in{max-width:1180px;margin:0 auto;padding:16px 20px}
.v-top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.v-top b{color:var(--ink-2);font-weight:500}
.v-main{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin-top:10px}
.v-num{font-family:var(--mono);font-size:44px;font-weight:600;line-height:.95;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.v-num small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:5px}
.v-lab{font-family:var(--cond);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.v-why{flex:1;min-width:280px;color:var(--ink-2);font-size:13.5px;max-width:56ch}
.v-kpis{display:flex;gap:26px;flex-wrap:wrap}
.v-k{display:flex;flex-direction:column;gap:2px}
.v-k .n{font-family:var(--mono);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums}
.v-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;border-radius:3px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
button:hover{color:var(--ink);border-color:var(--ink-3)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08);color:#fff}
/* snapped state */
.verdict.snap .v-main{margin-top:6px}
.verdict.snap .v-num{font-size:26px}
.verdict.snap .v-why,.verdict.snap .v-acts{display:none}
.verdict.snap .v-in{padding:9px 20px}

/* ============ 2. EVIDENCE — collapsed, one line each ============ */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  margin-top:14px;overflow:hidden}
.ev>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;
  gap:14px;align-items:baseline}
.ev>summary::-webkit-details-marker{display:none}
.ev>summary:hover{background:var(--surface-2)}
.ev-t{font-family:var(--cond);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);flex:none;width:150px}
.ev-c{flex:1;font-size:13.5px;min-width:200px}
.ev-c b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ev-x{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.ev[open] .ev-x::after{content:"− close"}
.ev:not([open]) .ev-x::after{content:"+ open"}
.ev-body{padding:2px 18px 18px;border-top:1px solid var(--line-2)}

/* ============ chips / callouts ============ */
.chip{font-family:var(--cond);font-size:9.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:2.5px 6px;border-radius:2px;white-space:nowrap}
.c-live{background:var(--good-bg);color:var(--good)}
.c-mock{background:var(--crit-bg);color:var(--crit)}
.c-est{background:var(--warn-bg);color:var(--warn)}
.c-neu{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.call{border-radius:4px;padding:11px 13px;font-size:13px;line-height:1.55;
  border:1px solid;margin-top:12px}
.call.w{background:var(--warn-bg);border-color:var(--warn)}
.call.c{background:var(--crit-bg);border-color:var(--crit)}
.call.g{background:var(--good-bg);border-color:var(--good)}
.call b{font-family:var(--cond);letter-spacing:.02em}

/* ============ tables — sticky head + sticky first col ============ */
.tw{overflow:auto;max-height:none;margin:0 -18px;padding:0 18px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{font-family:var(--cond);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:6px 10px 7px 0;font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:2}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{z-index:3}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:hover td:first-child{background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.best td,tr.best td:first-child{background:var(--accent-soft)}
.rank{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;margin-right:7px}
.tag{font-family:var(--cond);font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;background:var(--accent);color:#fff;padding:2px 5px;
  border-radius:2px;margin-left:6px}
.delta{color:var(--ink-3);font-size:12px}

/* ============ misc ============ */
.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;
  border-bottom:1px dotted var(--line-2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-family:var(--mono);
  font-variant-numeric:tabular-nums;font-weight:500}
dl{margin:0}
.grid2{display:grid;gap:0 26px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line-2);stroke-width:1}
.ax{fill:var(--ink-3);font-family:var(--mono);font-size:10px}
.dl{fill:var(--ink);font-family:var(--mono);font-size:11px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
.runway{height:26px;border-radius:3px;overflow:hidden;display:flex;
  border:1px solid var(--line);background:var(--surface-2)}
.runway i{display:block;height:100%}
.lev{display:grid;grid-template-columns:24px 1fr auto;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--line-2);align-items:start}
.lev:last-child{border-bottom:0}
.lev-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:3px;text-align:center;padding:1px 0}
.lev-v{font-family:var(--mono);font-size:13.5px;font-weight:600;text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:12px;line-height:1.6}

/* ============ PRINT — the PAR attachment ============
   Without these the forwarded PDF carries chrome nobody wants in an
   approval pack. Evidence sections are forced open; controls disappear. */
@media print{
  body{background:#fff;color:#000;font-size:10.5pt}
  .verdict{position:static;box-shadow:none;border-bottom:2px solid #000}
  .verdict.snap .v-why,.verdict.snap .v-acts{display:block}
  .verdict.snap .v-num{font-size:32px}
  .v-acts,button,.ev-x{display:none!important}
  .ev{border:1px solid #999;break-inside:avoid;margin-top:10px}
  .ev>summary{padding-bottom:6px}
  .ev-body{display:block!important}
  details:not([open])>.ev-body{display:block!important}
  .tw{overflow:visible;max-height:none}
  th{position:static} td:first-child,th:first-child{position:static}
  .call{break-inside:avoid}
  a[href]::after{content:""}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <p class="foot" id="foot"></p>
</div>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = id => document.getElementById(id);
const money = n => '₹' + Math.round(n).toLocaleString('en-IN');
const usd = n => '$' + n.toLocaleString('en-US',{maximumFractionDigits:0});
const t1 = n => n.toLocaleString('en-IN',{maximumFractionDigits:1});
const R = D.recommendation, F = D.forecast, C = D.coverage, Z = D.zinc,
      S = D.sourcing, N = D.negotiation, B = D.basis || {};

/* ---------- 1. PINNED VERDICT ---------- */
$('v-in').innerHTML = `
  <div class="v-top">
    <b>${D.material}</b> · ${D.plant} · ${D.destination.name} (tier ${D.destination.tier})
    · HS ${D.hs6}
    <span style="flex:1"></span>
    <span>Snapshot ${D.captured_at.replace('T',' ').replace('+00:00',' UTC')}</span>
  </div>
  <div class="v-main">
    <div>
      <div class="v-lab">Recommended action · 30 days</div>
      <div class="v-num">${R.recommended_commit_now_pct}%<small>commit now</small></div>
    </div>
    <div class="v-kpis">
      <div class="v-k"><span class="v-lab">Tonnes now</span><span class="n">${t1(R.recommended_tonnes_now)} t</span></div>
      <div class="v-k"><span class="v-lab">Coverage</span><span class="n">${C.coverage_weeks} wk</span></div>

      <div class="v-k"><span class="v-lab">Confidence</span><span class="n" style="color:var(--crit)">${R.confidence.toUpperCase()}</span></div>
    </div>
    <div class="v-why">Binding constraint is <b>${R.binding_constraint}</b>, not price.
      Coverage falls to ${R.coverage_weeks_if_deferred} wk against a
      ${R.policy_min_coverage_weeks} wk policy floor if fully deferred.
      <b style="color:var(--crit)">Inventory figures are mock</b> — this recommendation

/* snap the header once the reader scrolls past it */

addEventListener('scroll', () => vEl.classList.toggle('snap', scrollY > 90), {passive:true});
function openAll(){ document.querySelectorAll('details.ev').forEach(d => d.open = true); }
function toggleTheme(){
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme')==='dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme', dark ? 'light':'dark'); drawAll();
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 2. EVIDENCE, collapsed ---------- */
const best = S[0], worst = S[S.length-1];

  : `Unavailable — ${B.reason || 'no verdict offered'}`;

function ev(id,title,concl,body){ return `

$('evidence').innerHTML =
ev('e-cov','Coverage',
   `<b>${C.coverage_weeks} wk</b> on hand · <b>${t1(C.demand_next_30d_t)} t</b> demand in 30d ·

          <div class="kv"><dt>Safety floor</dt><dd>${t1(C.safety_stock_t)} t</dd></div></dl>
      <dl><div class="kv"><dt>Demand 30d</dt><dd>${t1(C.demand_next_30d_t)} t</dd></div>

      <dl><div class="kv"><dt>Net requirement</dt><dd>${t1(C.net_requirement_t)} t</dd></div>

      recommendation — the binding constraint is coverage, not price. Connecting the ERP is
      what makes this a procurement agent rather than a market dashboard.</div>`)
+
ev('e-src','Sourcing',
   `<b>${best.name}</b> cheapest at <b>${usd(best.landed)}/t</b> landed ·
    ${S.length} origins ranked · spread <b>${usd(worst.landed-best.landed)}/t</b>`,
   `<div id="chart-src"></div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--c-fob)"></i>FOB</span>
      <span><i class="swatch" style="background:var(--c-frt)"></i>Freight</span>
      <span><i class="swatch" style="background:var(--c-duty)"></i>Duty</span></div>
    <div class="tw" style="margin-top:12px"><table>
      <thead><tr><th>Origin</th><th class="n">Proven t</th><th class="n">FOB</th>
        <th class="n">Duty</th><th class="n">Landed</th><th class="n">vs best</th>
        <th class="n">LPI</th><th>Tariff basis</th></tr></thead>
      <tbody>${S.map((r,i)=>{
        const d = (r.landed-best.landed)/best.landed*100;
        return `<tr class="${i===0?'best':''}">
        <td><span class="rank">${i+1}</span><b>${r.name}</b>${i===0?'<span class="tag">Best value</span>':''}</td>

        <td class="n">${usd(r.fob)}</td><td class="n">${r.duty.toFixed(1)}%</td>
        <td class="n"><b>${usd(r.landed)}</b></td>
        <td class="n delta">${i===0?'—':'+'+d.toFixed(1)+'%'}</td>
        <td class="n">${r.lpi ?? '—'}</td>
        <td style="color:var(--ink-2);font-size:12px">${r.basis.replace('WITS/TRAINS ','')}</td></tr>`;}).join('')}
      </tbody></table></div>
    <div class="call g"><b>${best.name} wins on both legs.</b> Lowest FOB and a 0% preferential
      rate, while origins without an agreement pay MFN plus the 11.5% DGTR safeguard in force
      to ${(S.find(x=>x.surcharges.length)||{surcharges:[{}]}).surcharges[0].to}.
      A preferential rate needs a valid certificate of origin — this reports the rate, it
      cannot certify eligibility.</div>`)
+
ev('e-mkt','Market',
   `LME zinc <b>${usd(Z.cash)}/t</b> · ${Z.cash>Z.m3?'backwardation':'contango'}
    <b>${usd(Math.abs(Z.cash-Z.m3))}</b> · ${basisLine}`,
   `<div class="grid2" style="margin-bottom:10px">
      <dl><div class="kv"><dt>Cash</dt><dd>${usd(Z.cash)}/t</dd></div>
          <div class="kv"><dt>3-month</dt><dd>${usd(Z.m3)}/t</dd></div></dl>
      <dl><div class="kv"><dt>Curve</dt><dd>${Z.cash>Z.m3?'+':''}${usd(Z.cash-Z.m3).replace('$','')}</dd></div>
          <div class="kv"><dt>Warehouse stock</dt><dd>${Z.stock.toLocaleString('en-US')} t</dd></div></dl>
      ${B.available?`<dl><div class="kv"><dt>MCX front-month</dt><dd>₹${B.mcx_spot_inr_kg}/kg</dd></div>
          <div class="kv"><dt>Import parity</dt><dd>₹${B.landed_lme_parity_inr_kg}/kg</dd></div></dl>`:''}
    </div>
    <div id="chart-zinc"></div>
    <div class="legend">
      <span><svg width="22" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--c-fob)" stroke-width="2"/></svg>Cash settlement</span>
      <span><svg width="22" height="10" aria-hidden="true"><rect x="1" y="1" width="20" height="8" fill="var(--c-fob)" opacity=".18"/></svg>P10–P90, 30d</span>
      <span style="color:var(--ink-3)">${Z.source} · ${Z.as_of}</span></div>
    ${B.available?`<div class="call ${B.verdict==='TOO_CLOSE_TO_CALL'?'w':'g'}">
      <b>${B.verdict.replace(/_/g,' ')}.</b> ${B.verdict_reason}</div>`:''}

      Over ${F.calibration.walk_forward_windows} rolling windows the stated 80% band covered
      <b>${(F.calibration.empirical_coverage*100).toFixed(1)}%</b> of outcomes and spans

      to trade on. Shown because it reports its own limits, not because it is actionable.</div>`)

ev('e-neg','Negotiation',
   `<b>${N.supplier}</b> · <b>${N.premium_pct>0?'+':''}${N.premium_pct.toFixed(1)}%</b> vs benchmark ·

   `<div class="grid2" style="margin-bottom:10px">
      <dl><div class="kv"><dt>Annual spend</dt><dd>${money(N.spend)}</dd></div>
          <div class="kv"><dt>Contract price</dt><dd>${money(N.price)}/t</dd></div></dl>
      <dl><div class="kv"><dt>Benchmark</dt><dd>${money(N.benchmark)}/t</dd></div>
          <div class="kv"><dt>Share of capacity</dt><dd>${N.share_of_wallet.toFixed(0)}%</dd></div></dl>
    </div>
    <div style="font-family:var(--cond);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px">Ask in this order — cheapest for them first</div>
    ${N.levers.map((l,i)=>`<div class="lev"><div class="lev-n">${i+1}</div>

      of rejected offers exists.</div>`);

/* ---------- audit trail (level 2) ---------- */
const chipFor = s => s==='live'?'c-live':s==='mock'?'c-mock':
  (['estimate','simulated','manual'].includes(s)?'c-est':'c-neu');
$('audit-body').innerHTML = `
  <div class="tw"><table>
    <thead><tr><th>Input</th><th>Status</th><th>Cost</th><th>Source</th></tr></thead>
    <tbody>${D.provenance.map(p=>`<tr><td>${p.item}</td>
      <td><span class="chip ${chipFor(p.status)}">${p.status}</span></td>
      <td class="num" style="font-size:12px">${p.cost}</td>
      <td style="color:var(--ink-2);font-size:12.5px">${p.source}</td></tr>`).join('')}
    </tbody></table></div>
  <div class="call c"><b>${D.stale_control.label} is a deliberate negative control.</b>
    It reports ${usd(D.stale_control.value)}/t — confident-looking, last traded
    <b>${D.stale_control.age_days.toFixed(0)} days ago</b>, and
    <b>${D.stale_control.error_pct}% wrong</b>. Every observation here carries its own
    timestamp and flags itself stale past three days.</div>
  ${B.available && B.assumptions ? `<div class="call w"><b>Assumptions behind the basis.</b>
    Freight ${usd(B.assumptions.ocean_freight_usd_t)}/t (estimate), duty
    ${B.assumptions.duty_pct}%, port+inland ${money(B.assumptions.port_inland_inr_t)}/t,
    physical premium ${B.assumptions.physical_premium}. A basis inside ±4% sits within

$('foot').innerHTML = `Destination <b>${D.destination.name}</b> is tier

/* ---------- charts ---------- */
function drawSrc(){
  const el=$('chart-src'); if(!el||!el.offsetParent) return;
  const rows=S.slice(0,6), W=560, rowH=29, m={t:6,r:76,b:18,l:92};
  const Hh=m.t+rows.length*rowH+m.b, iw=W-m.l-m.r;
  const max=Math.max(...rows.map(r=>r.landed))*1.04, X=v=>(v/max)*iw;
  const cF=cssv('--c-fob'),cR=cssv('--c-frt'),cD=cssv('--c-duty');
  let b='';
  rows.forEach((r,i)=>{
    const y=m.t+i*rowH+5,h=17,duty=r.landed-r.fob-r.freight;
    let x=m.l;
    [[r.fob,cF,'FOB'],[r.freight,cR,'Freight'],[duty,cD,'Duty']].forEach(([v,c,lab],k)=>{
      b+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0,X(v)-(k<2?2:0)).toFixed(1)}" height="${h}" fill="${c}"${k===2?' rx="3"':''}><title>${r.name} — ${lab} ${usd(v)}/t</title></rect>`;
      x+=X(v);
    });
    b+=`<text class="ax" x="${m.l-8}" y="${y+13}" text-anchor="end" style="font-size:11px;fill:var(--ink)">${r.name}</text>`;
    b+=`<text class="dl" x="${(m.l+X(r.landed)+7).toFixed(1)}" y="${y+13}">${usd(r.landed)}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Landed cost per tonne by source country, split into FOB, freight and duty">${b}<text class="ax" x="${m.l}" y="${Hh-3}">0</text><text class="ax" x="${m.l+iw}" y="${Hh-3}" text-anchor="end">${usd(max)}/t</text></svg>`;
}
function drawZinc(){
  const el=$('chart-zinc'); if(!el||!el.offsetParent) return;
  const H=Z.history, W=660, Hh=210, m={t:12,r:58,b:22,l:52};
  const iw=W-m.l-m.r, ih=Hh-m.t-m.b, nH=H.length, nF=F.horizon_days;
  const vals=H.map(d=>d.cash).concat([F.p10,F.p90]);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const X=i=>m.l+(i/(nH+nF-1))*iw, Y=v=>m.t+ih-((v-lo)/(hi-lo))*ih;
  const acc=cssv('--c-fob'), l2=cssv('--line-2');
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v);
    g+=`<line class="gl" x1="${m.l}" y1="${y.toFixed(1)}" x2="${m.l+iw}" y2="${y.toFixed(1)}"/>`;
    g+=`<text class="ax" x="${m.l-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${Math.round(v).toLocaleString('en-US')}</text>`; }
  const path=H.map((d,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(d.cash).toFixed(1)}`).join('');
  const last=nH-1, ex=X(nH+nF-1);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="LME zinc cash over ${nH} days with a 30-day forecast band from ${usd(F.p10)} to ${usd(F.p90)} per tonne">
    ${g}<path d="M${X(last).toFixed(1)},${Y(Z.cash).toFixed(1)} L${ex.toFixed(1)},${Y(F.p90).toFixed(1)} L${ex.toFixed(1)},${Y(F.p10).toFixed(1)} Z" fill="${acc}" opacity=".18"/>
    <path d="M${X(last).toFixed(1)},${Y(Z.cash).toFixed(1)} L${ex.toFixed(1)},${Y(F.p50).toFixed(1)}" fill="none" stroke="${acc}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".75"/>
    <path d="${path}" fill="none" stroke="${acc}" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${X(last).toFixed(1)}" y1="${m.t}" x2="${X(last).toFixed(1)}" y2="${m.t+ih}" stroke="${l2}" stroke-dasharray="2 3"/>
    <circle cx="${X(last).toFixed(1)}" cy="${Y(Z.cash).toFixed(1)}" r="3.5" fill="${acc}"/>
    <text class="dl" x="${(ex+6).toFixed(1)}" y="${(Y(F.p90)+4).toFixed(1)}">${usd(F.p90)}</text>
    <text class="dl" x="${(ex+6).toFixed(1)}" y="${(Y(F.p50)+4).toFixed(1)}">${usd(F.p50)}</text>
    <text class="dl" x="${(ex+6).toFixed(1)}" y="${(Y(F.p10)+4).toFixed(1)}">${usd(F.p10)}</text>
    <text class="ax" x="${m.l}" y="${Hh-4}">${H[0].d}</text>
    <text class="ax" x="${m.l+iw}" y="${Hh-4}" text-anchor="end">+30d</text></svg>`;
}
function drawAll(){ drawSrc(); drawZinc(); }
document.querySelectorAll('details.ev').forEach(d =>
  d.addEventListener('toggle', () => { if(d.open) drawAll(); }));
addEventListener('beforeprint', () => { openAll(); drawAll(); });
addEventListener('resize', drawAll);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', drawAll);
drawAll();
</script>
